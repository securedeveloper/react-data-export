# Dependabot version updates.
#
# Security updates are switched on in the repository settings and run as
# soon as an advisory appears, independent of the schedules here. The
# ignore rules and the commit prefix of the first npm entry apply to them
# too. Version updates run on the schedules below, grouped so that each run
# opens only a few PRs.
version: 2
updates:
  - package-ecosystem: npm
    # The root lockfile covers every workspace (packages/*, apps/*).
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      # All dev-dependency minor and patch updates in one PR.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # All runtime-dependency minor and patch updates in one PR.
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      # Major updates separately, together in one PR, so they can be
      # reviewed (or closed) as a set.
      major-updates:
        update-types: [major]
    ignore:
      # TypeScript 7 is pinned on purpose. tsdown's declaration bundler
      # (rolldown-plugin-dts) accepts only specific TypeScript minors
      # (~7.0 / ~7.1 today), so minors and majors move by hand together
      # with tsdown. Patch releases still come through.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # tsdown is 0.x, where a minor release is a breaking one, and each
      # tsdown minor pins its own rolldown line (0.23 -> rolldown ~1.3)
      # and TypeScript range. Upgrade tsdown, rolldown and TypeScript as a
      # pair by hand; patch releases still come through.
      - dependency-name: tsdown
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
    groups:
      # Every workflow action update (any semver level) in one PR.
      github-actions:
        patterns: ["*"]
