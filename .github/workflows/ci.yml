name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        react: [17, 18, 19]
    env:
      # Asserted by the test suite, so a job can't silently run on the wrong React.
      REACT_MAJOR: ${{ matrix.react }}
      SMOKE_REACT: ${{ matrix.react }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # React 19 is the committed default: install exactly from the lockfile.
      - name: Install (lockfile)
        if: matrix.react == 19
        run: npm ci

      # React 17/18: rewrite the dev ranges and resolve a fresh tree (see the script).
      - name: Install (React ${{ matrix.react }})
        if: matrix.react != 19
        run: node scripts/use-react.mjs ${{ matrix.react }}

      - name: Resolved versions
        run: node scripts/print-versions.mjs

      - name: Typecheck (library + playground)
        if: matrix.react == 19
        run: npm run typecheck

      - name: Typecheck (library)
        if: matrix.react != 19
        run: npm run typecheck -w react-data-export

      - name: Test
        run: npm test

      # The playground's own unit tests (option mapping, preview grid); React 19 only, like its typecheck.
      - name: Test playground
        if: matrix.react == 19
        run: npm test -w playground

      - name: Build library
        run: npm run build -w react-data-export

      - name: Lint package (publint + are-the-types-wrong)
        if: matrix.react == 19
        run: npm run lint:pkg

      - name: Smoke test packed tarball (ESM, CJS, types)
        run: npm run smoke

      - name: Build playground
        if: matrix.react == 19
        run: npm run build -w playground

      - name: npm pack --dry-run
        if: matrix.react == 19 && matrix.node == 24
        run: npm pack --dry-run -w react-data-export

  # Consumer TypeScript matrix: one tarball, type-checked by a consumer project
  # on several TypeScript versions, @types/react majors and moduleResolution modes.
  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w react-data-export
      - name: npm pack
        run: |
          mkdir -p pack
          npm pack -w react-data-export --pack-destination pack
          mv pack/*.tgz pack/react-data-export.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: pack/react-data-export.tgz
          retention-days: 3

  consumer-ts:
    name: Consumer TS ${{ matrix.ts }} / @types/react ${{ matrix.react }}
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every minor from the supported floor (5.0) up, same set as javascript-excel.
        ts: ['5.0', '5.1', '5.2', '5.3', '5.4', '5.5', '5.6', '5.7', '5.8', '5.9', '6.0', '7.0']
        react: [18, 19]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: pack
      # The script only uses Node built-ins; it installs typescript, react and
      # @types/react into a throwaway consumer project per cell.
      - name: Type-check consumer fixture
        run: >-
          node scripts/consumer-ts.mjs
          --tarball pack/react-data-export.tgz
          --ts ${{ matrix.ts }}
          --react ${{ matrix.react }}
          --resolution node16,nodenext,bundler

  # Single stable name to mark as a required check.
  consumer-ts-result:
    name: Consumer TS
    needs: consumer-ts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All consumer TypeScript cells passed
        run: test "${{ needs.consumer-ts.result }}" = success

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    env:
      PACKAGE_DIR: packages/react-data-export
    steps:
      # On a pull_request, HEAD is the test merge commit and HEAD~1 is the
      # base branch tip, so the release check below previews what merging
      # this PR would do.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Release script unit tests
        run: node --test "scripts/*.test.mjs"
      - name: Release preview (what merging this would publish)
        id: check
        run: node scripts/release-check.mjs --package "$PACKAGE_DIR"
      - run: npm run build --if-present
      - name: npm pack --dry-run
        run: npm pack "./$PACKAGE_DIR" --dry-run
      - name: npm publish --dry-run
        env:
          PUBLISHED: ${{ steps.check.outputs.published }}
          DIST_TAG: ${{ steps.check.outputs.dist-tag }}
        run: |
          if [ "$PUBLISHED" = "true" ]; then
            # npm refuses even a dry run over a version that is already on
            # npm, so dry-run a throwaway prerelease of it instead (this
            # checkout is discarded after the job).
            (cd "$PACKAGE_DIR" && npm version prerelease --preid dryrun --no-git-tag-version --ignore-scripts --workspaces-update=false)
            DIST_TAG=next
          fi
          npm publish "./$PACKAGE_DIR" --dry-run --tag "$DIST_TAG"

  # The packed tarball in real bundlers with no Node polyfill config
  # (fixtures/, scripts/bundlers.mjs): Vite + React 19, Next.js 16 App
  # Router (webpack and Turbopack, server prerender), Create React App 5
  # (webpack 5), React 17 + TypeScript. Not a required check.
  bundlers:
    name: Bundlers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build every fixture against the packed tarball
        run: npm run bundlers
